name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  services-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check backend entry
        run: node --check backend/server.js

      - name: Check backend source files
        run: find backend/src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Check AI service entry
        run: node --check ai-service/server.js

      - name: Check AI service source files
        run: find ai-service/src -name "*.js" -print0 | xargs -0 -n1 node --check
